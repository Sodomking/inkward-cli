name: Test and release native launcher
on:
  push:
    tags: ['v2.*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    uses: ./.github/workflows/ci.yml
  build:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/go.sum
      - name: Cross-compile dependency-free launchers
        working-directory: native
        run: |
          mkdir -p ../release
          for target in darwin-amd64 darwin-arm64 windows-amd64 windows-arm64; do
            target_os="${target%-*}"
            target_arch="${target#*-}"
            suffix=''
            if [ "$target_os" = windows ]; then suffix='.exe'; fi
            CGO_ENABLED=0 GOOS="$target_os" GOARCH="$target_arch" go build -trimpath -buildvcs=false -ldflags='-s -w' -o "../release/inkward-$target$suffix" .
          done
          cd ../release
          sha256sum inkward-* > SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: native-launchers
          path: release/*
  release:
    if: startsWith(github.ref, 'refs/tags/v2.')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: native-launchers
          path: release
      - name: Publish tested native release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" release/* --verify-tag --title "INKWARD $TAG — 无需 Node / Git" --notes-file RELEASE-NOTES.md
