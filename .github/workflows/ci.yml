name: CLI checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
permissions:
  contents: read
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.3'
          cache-dependency-path: native/go.sum
      - name: Native tests (fixtures only; no proxy changes)
        working-directory: native
        run: go test -v ./...
      - name: Build and smoke native executable
        shell: bash
        working-directory: native
        run: |
          go build -trimpath -buildvcs=false -ldflags='-s -w' -o inkward-test.exe .
          ./inkward-test.exe version
          ./inkward-test.exe info --json
      - name: macOS bootstrap architecture detection (no downloads or settings)
        if: runner.os == 'macOS'
        run: sh start.sh --plan
      - name: Windows bootstrap architecture detection (no downloads or settings)
        if: runner.os == 'Windows'
        shell: powershell
        run: .\start.ps1 -Plan
      - name: macOS download, checksum and read-only setup
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set +e
          sh start.sh --yes --dry-run --no-open > bootstrap-report.json
          result=$?
          set -e
          if [ "$result" != 0 ] && [ "$result" != 2 ]; then exit "$result"; fi
          python3 -c 'import json; r=json.load(open("bootstrap-report.json")); assert r["version"]=="2.0.1" and r["os"]=="darwin" and not r["browserRequested"] and not r["companyIntroRequested"]'
      - name: Windows download, checksum and read-only setup
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          & .\start.ps1 -Yes -DryRun -NoOpen > bootstrap-report.json
          if ($LASTEXITCODE -notin @(0,2)) { throw 'Native setup failed' }
          $report = Get-Content bootstrap-report.json -Raw | ConvertFrom-Json
          if ($report.version -ne '2.0.1' -or $report.os -ne 'windows' -or $report.browserRequested -or $report.companyIntroRequested) { throw 'Unexpected setup report' }
          exit 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Legacy Node CLI compatibility
        run: node --test cli.test.cjs
